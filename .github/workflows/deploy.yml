name: Deploy redirect and love letter

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "pages-redirect/**"
      - "public/mini-love/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Pages artifact
        run: |
          mkdir -p pages-artifact
          cp -a pages-redirect/. pages-artifact/
          cp -a public/mini-love pages-artifact/mini-love
      - name: Upload redirect and letter
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
